name: Generador Diario de Brief

on:
  schedule:
    # 06:30 AM hora de Chile (UTC-3) -> 09:30 UTC
    - cron: '30 9 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pipeline del Brief Diario
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: node scripts/generateBrief.js

      - name: Confirmar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No hay cambios para hoy. El brief ya está actualizado."
          else
            TODAY=$(date -u +"%Y-%m-%d")
            git commit -m "chore(brief): auto-generate daily brief for $TODAY [skip ci]"
            git push origin main
            echo "✓ Brief diario subido exitosamente a la rama main."
          fi
